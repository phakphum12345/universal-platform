name: Engineering Core Tests

on:
  push:
    branches:
      - main
      - "docs/**"
      - "feat/**"
  pull_request:
    branches:
      - main
      - "docs/phase-0-complete-requirements"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow bootstrap
        run: test -s .github/workflows/engineering-core.yml
      - name: Validate CAD Generator JavaScript syntax
        if: hashFiles('src/universal_platform/engineering/static/cad_generator.js') != ''
        run: node --check src/universal_platform/engineering/static/cad_generator.js

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Python project
        id: project
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and test dependencies
        if: steps.project.outputs.present == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Run engineering core tests
        if: steps.project.outputs.present == 'true'
        run: python -m pytest -q
      - name: Mark code tests as not applicable on documentation-only branch
        if: steps.project.outputs.present != 'true'
        run: echo "SKIPPED — pyproject.toml is not present on this documentation-only branch."
