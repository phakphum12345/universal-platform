name: Repository Quality and Dependency Security

on:
  push:
    branches:
      - main
      - "docs/phase-0-complete-requirements"
  pull_request:
    branches:
      - main
      - "docs/phase-0-complete-requirements"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and quality tools
        run: python -m pip install -e ".[quality]"
      - name: Run Ruff static analysis
        run: python -m ruff check src tests
      - name: Audit installed Python dependencies
        if: always()
        run: python -m pip_audit
